<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="250" viewBox="0 0 900 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SilvaTechN live GitHub activity</title>
  <desc id="desc">A neon activity panel that is updated automatically by GitHub Actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060706"/>
      <stop offset="0.55" stop-color="#10150B"/>
      <stop offset="1" stop-color="#020302"/>
    </linearGradient>
    <linearGradient id="line" x1="40" y1="20" x2="860" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9CFF00"/>
      <stop offset="0.5" stop-color="#D9FF9A"/>
      <stop offset="1" stop-color="#9CFF00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#9CFF00" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="900" height="250" rx="18" fill="url(#bg)"/>
  <rect width="900" height="250" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="898" height="248" rx="17" stroke="#9CFF00" stroke-opacity="0.7" stroke-width="2"/>
  <path d="M0 204C132 172 192 227 311 186C429 145 512 166 613 116C710 68 757 78 900 32" stroke="#9CFF00" stroke-opacity="0.2" stroke-width="2"/>
  <path d="M0 204C132 172 192 227 311 186C429 145 512 166 613 116C710 68 757 78 900 32" stroke="url(#line)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="613" cy="116" r="5" fill="#9CFF00" filter="url(#glow)"/>
  <circle cx="613" cy="116" r="11" stroke="#9CFF00" stroke-opacity="0.4"/>
  <text x="44" y="52" fill="#9CFF00" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">LIVE GITHUB ACTIVITY</text>
  <text x="44" y="99" fill="#F3F7EE" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Signal detected.</text>
  <text x="44" y="129" fill="#B8C4AE" font-family="Arial, Helvetica, sans-serif" font-size="15">The first activity pulse will appear after GitHub Actions runs.</text>
  <text x="44" y="205" fill="#8C9B80" font-family="Arial, Helvetica, sans-serif" font-size="13">AUTOMATED · PUBLIC EVENTS · SILVATECHN</text>
  <circle cx="827" cy="51" r="7" fill="#9CFF00" filter="url(#glow)"/>
</svg>