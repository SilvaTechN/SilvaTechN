name: Update profile activity

on:
  schedule:
    # GitHub does not reliably support schedules more often than every 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile
        uses: actions/checkout@v4

      - name: Build live activity card
        env:
          PROFILE_USERNAME: SilvaTechN
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          username = os.environ["PROFILE_USERNAME"]
          output = Path("assets/live-activity.svg")
          endpoint = f"https://api.github.com/users/{username}/events/public?per_page=8"
          request = urllib.request.Request(
              endpoint,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": f"{username}-profile-readme",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  events = json.load(response)
          except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as error:
              print(f"GitHub API unavailable; keeping the last good card: {error}")
              raise SystemExit(0)

          def safe(value):
              return html.escape(str(value), quote=True)

          def event_text(event):
              event_type = event.get("type", "")
              repo = event.get("repo", {}).get("name", "a repository")
              short_repo = repo.split("/", 1)[-1]
              payload = event.get("payload", {})
              if event_type == "PushEvent":
                  count = len(payload.get("commits", []))
                  return f"Pushed {count or 'new'} commit{'s' if count != 1 else ''} to {short_repo}"
              if event_type == "PullRequestEvent":
                  action = payload.get("action", "updated")
                  return f"{action.capitalize()} a pull request in {short_repo}"
              if event_type == "IssuesEvent":
                  action = payload.get("action", "updated")
                  return f"{action.capitalize()} an issue in {short_repo}"
              if event_type == "IssueCommentEvent":
                  return f"Commented on an issue in {short_repo}"
              if event_type == "CreateEvent":
                  return f"Created {payload.get('ref_type', 'a project')} {short_repo}"
              if event_type == "WatchEvent":
                  return f"Starred {short_repo}"
              if event_type == "ForkEvent":
                  return f"Forked {short_repo}"
              return f"Activity in {short_repo}"

          rows = []
          for event in events[:4]:
              created = event.get("created_at")
              if created:
                  try:
                      when = datetime.fromisoformat(created.replace("Z", "+00:00"))
                      stamp = when.strftime("%d %b %Y · %H:%M UTC")
                  except ValueError:
                      stamp = "Recently"
              else:
                  stamp = "Recently"
              rows.append((event_text(event), stamp))

          if not rows:
              rows = [("No recent public events — a quiet signal is still a signal.", "Waiting for the next build")]

          now = datetime.now(timezone.utc).strftime("%d %b %Y · %H:%M UTC")
          text_rows = []
          for index, (message, stamp) in enumerate(rows):
              y = 112 + index * 28
              text_rows.append(
                  f'<circle cx="48" cy="{y - 5}" r="3" fill="#9CFF00"/>'
                  f'<text x="64" y="{y}" fill="#F3F7EE" font-family="Arial, Helvetica, sans-serif" font-size="14">{safe(message)}</text>'
                  f'<text x="850" y="{y}" text-anchor="end" fill="#8C9B80" font-family="Arial, Helvetica, sans-serif" font-size="11">{safe(stamp)}</text>'
              )

          svg = f'''<?xml version="1.0" encoding="UTF-8"?>
          <svg width="900" height="250" viewBox="0 0 900 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
            <title id="title">SilvaTechN live GitHub activity</title>
            <desc id="desc">The latest public GitHub activity for SilvaTechN.</desc>
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="900" y2="250" gradientUnits="userSpaceOnUse">
                <stop stop-color="#060706"/><stop offset="0.55" stop-color="#10150B"/><stop offset="1" stop-color="#020302"/>
              </linearGradient>
              <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
                <path d="M36 0H0V36" stroke="#9CFF00" stroke-opacity="0.08"/>
              </pattern>
              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <rect width="900" height="250" rx="18" fill="url(#bg)"/>
            <rect width="900" height="250" rx="18" fill="url(#grid)"/>
            <rect x="1" y="1" width="898" height="248" rx="17" stroke="#9CFF00" stroke-opacity="0.7" stroke-width="2"/>
            <path d="M0 204C132 172 192 227 311 186C429 145 512 166 613 116C710 68 757 78 900 32" stroke="#9CFF00" stroke-opacity="0.2" stroke-width="2"/>
            <text x="44" y="52" fill="#9CFF00" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">LIVE GITHUB ACTIVITY</text>
            {''.join(text_rows)}
            <text x="44" y="232" fill="#8C9B80" font-family="Arial, Helvetica, sans-serif" font-size="11">LAST SYNC · {safe(now)}</text>
            <circle cx="827" cy="51" r="7" fill="#9CFF00" filter="url(#glow)"/>
          </svg>
          '''
          output.write_text(svg, encoding="utf-8")
          PY

      - name: Commit refreshed card when it changed
        run: |
          if git diff --quiet -- assets/live-activity.svg; then
            echo "No activity changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live-activity.svg
          git commit -m "chore: refresh profile activity"
          git push
